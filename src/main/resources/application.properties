# ==============================================================================
# BYCAP GATEWAY CONFIGURATION (Default: Embedded H2 for Instant Execution)
# ==============================================================================
server.port=8081
spring.application.name=bycap-gateway

# H2 Database Connection (Zero-config local mode)
spring.datasource.url=jdbc:h2:mem:bycapdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2 Web Console (Inspect live database tables at /h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Wompi Integration Secret (Webhook Signature Verification)
bycap.wompi.events-secret=prod_events_bycap_secret_2026
bycap.merchant.default-id=11111111-1111-1111-1111-111111111111
bycap.merchant.name=Bycap Flagship Store Valledupar
